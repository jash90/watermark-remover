[package]
name = "watermark-remover"
version = "0.2.2"
description = "A Tauri App for removing watermarks from images"
authors = ["you"]
edition = "2021"

[lib]
name = "watermark_remover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.9", features = [] }
tauri-plugin-opener = "~2.2"
tauri-plugin-dialog = "~2.2"
tauri-plugin-fs = "~2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
imageproc = "0.25"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tempfile = "3"
jpeg-encoder = "0.7"
png = "0.18"
num-traits = "0.2"
sha2 = "0.10"
ureq = "3"

# ONNX Runtime everywhere it ships binaries (not Intel macOS).
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["ndarray"] }
ndarray = "0.17"

# GPU/NPU acceleration where available; Cargo unions these features with the table above.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["ndarray", "coreml"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["ndarray", "directml"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

# `tauri dev` builds with this profile; unoptimised pixel loops are ~10x slower.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
